name: Release

# Push a tag such as v0.1.0 to build installers for macOS, Windows and Linux.
# They are attached to a draft GitHub release, which is published once every
# platform has built, so download and update links never point at a
# half-filled release.
#
# With the TAURI_SIGNING_PRIVATE_KEY secret set (see docs/RELEASE.md), the
# release also carries signed updater packages, latest.json, and policy.json:
# the signed policy that tells older apps whether they must update.
on:
  push:
    tags: ["v*"]
  # Or run it by hand: the tag is created on the chosen branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
      force:
        description: Require every older version to update to this one
        type: boolean
        default: false
      notes:
        description: What's new (shown in the update dialog)
        required: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          # NSIS only: WiX (MSI) rejects the "&" in "M&J Group", and the
          # download links and updater use the NSIS installer.
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Bundle CJK fonts for PDF export
        shell: bash
        run: scripts/fetch-fonts.sh
      - name: Updater key missing
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no in-app updates"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: JmdEditor ${{ env.TAG }}
          commitish: ${{ github.sha }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}

  # The export API for the mini-program and browser build, as a static Linux
  # binary with its start script, config, fonts and web app, ready for
  # BaoTa (宝塔) or systemd. See deploy/linux/宝塔部署说明.md.
  server:
    needs: desktop
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --release --locked -p jmd-server --target x86_64-unknown-linux-musl
      - name: Pack and attach
        run: |
          scripts/package-server.sh target/x86_64-unknown-linux-musl/release/jmd-server jmd-server-linux-x64.tar.gz
          gh release upload "$TAG" jmd-server-linux-x64.tar.gz --clobber

  publish:
    needs: [desktop, server]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FORCE: ${{ inputs.force }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign and attach the update policy
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          version="${TAG#v}"
          minimum=$(jq -r .minimum apps/desktop/src-tauri/update-policy.json)
          if [ "$FORCE" = "true" ]; then minimum="$version"; fi
          jq -n --arg v "$version" --arg m "$minimum" --arg n "$NOTES" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, minimum: $m, notes: $n, pub_date: $d}' > policy.json
          cat policy.json
          npx --yes @tauri-apps/cli@2 signer sign policy.json
          gh release upload "$TAG" policy.json policy.json.sig --clobber
      # --target: a draft left by an earlier, cancelled run may still point
      # at an older commit; the tag must point at the commit that was built.
      - name: Publish the release
        run: gh release edit "$TAG" --target "$GITHUB_SHA" --draft=false --latest
