[workspace]
resolver = "2"
members = [
  "crates/jmd-core",
  
  
  
  
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["M&J Group <473276@qq.com>"]
license = "MIT"
repository = "https://github.com/luckySpro/JmdEditor"
rust-version = "1.85"

[workspace.dependencies]
jmd-core = { path = "crates/jmd-core" }
jmd-import = { path = "crates/jmd-import" }
jmd-export = { path = "crates/jmd-export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
