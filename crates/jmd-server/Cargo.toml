[package]
name = "jmd-server"
description = "HTTP API for JmdEditor's browser build and WeChat mini-program: URL import and Word/PDF export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
jmd-core.workspace = true
jmd-import.workspace = true
jmd-export.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1.5"
