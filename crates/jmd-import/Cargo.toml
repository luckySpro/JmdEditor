[package]
name = "jmd-import"
description = "Import Markdown from URLs for JmdEditor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
jmd-core.workspace = true
serde.workspace = true
thiserror.workspace = true
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
tokio = { workspace = true, features = ["net", "fs", "time"] }
dom_smoothie = "0.18"
htmd = "0.5"
sha2 = "0.10"
hex = "0.4"
encoding_rs = "0.8"

[dev-dependencies]
tokio.workspace = true
